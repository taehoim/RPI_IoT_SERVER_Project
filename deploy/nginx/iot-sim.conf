# SIM ONLY — port 80 plain HTTP. Production deployments must:
#   1. Terminate TLS (Let's Encrypt, mTLS, or cloud LB)
#   2. Migrate JWT from localStorage to httpOnly Secure cookies
#   3. Restrict listen to internal IPs or wrap in a VPN
# Tracking issue: TODO open before merging this nginx config to a non-sim env.

server {
  listen 80 default_server;
  server_name _;

  # FastAPI backend (auth, dashboard, telemetry, commands)
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;          # SSE 대비 (Phase 2)
    # Polling-only for now (5s refetchInterval). 30s covers slow upstreams
    # without leaving worker connections held for an hour on hung requests.
    proxy_read_timeout 30s;
  }

  # Next.js standalone server (SSR + static)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}
