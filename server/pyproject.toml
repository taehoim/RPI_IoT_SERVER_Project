[project]
name = "iot-gateway-server"
version = "0.1.0+phase2"
description = "Self-hosted IoT Gateway Fleet Management Platform — server side"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "aiomqtt>=2.3",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "jsonschema>=4.23",
    "sdnotify>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
iot-backend   = "app.main:run"
iot-worker    = "worker.main:run"
iot-scheduler = "scheduler.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker", "scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
